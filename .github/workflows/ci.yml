name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.x"

      - name: Install dependencies
        run: opam install . --deps-only --with-test

      - name: Build
        run: opam exec -- dune build

      # Covers the test suites, the examples (typechecked, and the hermetic
      # ones executed), the stdlib linting clean, and the reference documenting
      # exactly the rules that exist.
      - name: Test
        run: opam exec -- dune test

      # The shell-dependent examples are only typechecked by the suite, since
      # the test sandbox is not a git repository. Here the checkout is one, so
      # they can be run for real.
      - name: Run shell-dependent examples
        run: |
          set -euo pipefail
          WAND=_build/default/bin/wand.exe
          git config --global --add safe.directory "$PWD"
          "$WAND" examples/sysinfo.wand
          "$WAND" examples/repo-status.wand
          "$WAND" examples/party.wand
          printf 'INFO a\nERROR b\n' | "$WAND" examples/log-summary.wand

      # The demos are acceptance tests: if one stops making its point,
      # something regressed. D9 is left out -- it deliberately runs a bash
      # loop that takes half a minute.
      - name: Run demos
        run: |
          set -euo pipefail
          demos/d1-unset-variable/run.sh
          demos/d2-domain-types/run.sh
          demos/d3-typed-holes/run.sh
          demos/d4-signatures/run.sh
          demos/d5-rehearse/run.sh
          demos/d6-unplugged/run.sh
          demos/d7-jq-typed/run.sh
          demos/d8-fan-out/run.sh

      # D9 at a tenth of its usual input. Its point -- a bash loop losing to
      # everything by orders of magnitude -- is visible at any size; the big
      # number is for a human reading it. Ninety-six seconds was why it was
      # skipped, and being skipped is why it rotted under a signature change
      # with nothing noticing.
      - name: Run D9 at a size CI can afford
        run: N=500 demos/d9-fork-overhead/run.sh

      # wand fmt is the canonical form: running it on a formatted tree changes
      # nothing. Checked on a copy so a failure reports rather than rewrites.
      #
      # The check itself is a wand script. It runs here, after the suites,
      # rather than earlier: the binary it uses is the one this build just
      # produced, so anything ahead of it has to be able to fail without a
      # wand script running at all.
      - name: Check the stdlib is formatted
        env:
          WAND: ${{ github.workspace }}/_build/default/bin/wand.exe
        run: $WAND ci/check_stdlib_fmt.wand

      # setup-wand's test suite is written in wand and is the only wand code
      # that exercises an installed binary the way a user meets it. Nothing
      # in that repository runs against an unreleased wand, so a change here
      # could break it and nobody would know until the next release. Run it
      # against this build.
      - uses: actions/checkout@v4
        with:
          repository: mjstahl/setup-wand
          path: .setup-wand

      - name: Run setup-wand's suite against this build
        run: |
          set -euo pipefail
          WAND="$PWD/_build/default/bin/wand.exe"
          export PATH="$(dirname "$WAND"):$PATH"
          # The suite calls `wand`, so it has to find this build rather than
          # anything else on PATH -- and the copy in _build is wand.exe.
          ln -sf "$WAND" "$(dirname "$WAND")/wand"
          cd .setup-wand
          EXPECTED_VERSION="$(cat ../VERSION)" wand test test
