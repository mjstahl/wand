name: Release

# Tagging publishes. `workflow_dispatch` builds and uploads the same
# artifacts without creating a release, which is how the matrix gets checked
# before a tag makes it permanent.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runs-on }}
    # See ci.yml: a hung runner fails in minutes, not GitHub's six hours.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # OCaml has no cross-compilation worth relying on: ocamlopt emits
          # code for the machine it was built for, and every dependency would
          # have to be rebuilt for the target. So each artifact is built on
          # its own hardware.
          #
          # macOS x86_64 is missing on purpose. Its runner never leaves the
          # queue, and `make release` builds that archive on a developer's
          # Intel Mac and attaches it to the same draft release.
          - target: linux-x86_64
            runs-on: ubuntu-latest
            static: true
          - target: linux-aarch64
            runs-on: ubuntu-24.04-arm
            static: true
          - target: macos-aarch64
            runs-on: macos-15
            static: false

    steps:
      - uses: actions/checkout@v4

      # The Linux binaries are built inside Alpine and linked statically
      # against musl, so they run wherever they are copied. The image is
      # multi-arch, so the same reference builds natively on both runners.
      # Docker is driven directly rather than through `container:`, which
      # would put the checkout and the image's `opam` user at odds.
      # Retried, because one thing this does is build dune from source and
      # that has twice died with
      #
      #   Fatal error: Failed to allocate signal stack for domain 0
      #
      # -- the OCaml runtime failing to start, while opam compiled
      # dune.3.24.2, before any of wand was reached. Twice in the last
      # twenty-five releases, both on x86_64, never on aarch64. It does not
      # reproduce off the runners: 320 concurrent starts of the same binary
      # in the same image, under memory limits down to 16 MB, produced none
      # of it. So it is not something this repository can fix, only
      # something it can stop paying for. The step is a container build and
      # rebuilding it costs nothing but time.
      # Pinned by digest, not by tag. `alpine-ocaml-5.4` moves: it is rebuilt
      # with a newer opam repository snapshot whenever one lands, so two
      # releases cut a day apart are built by two different toolchains and
      # neither says so. This digest is the image that built 0.55.0.
      #
      # A build that fails here fails inside the container, compiling dune
      # from source, before any wand code is reached. That is worth being
      # able to hold still while the cause is found.
      #
      # To move it: read `Digest: sha256:...` from a run that worked.
      - name: Build (Linux, static musl)
        if: matrix.static
        run: |
          set -euo pipefail
          attempt=1
          until docker run --rm -v "$PWD:/src" -w /src \
            -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            ocaml/opam:alpine-ocaml-5.4@sha256:8e26f87086ac85e521889b26b35709220bdd13b2019a1524157e6de5caf3cff4 sh -c '
              set -eu
              sudo chown -R opam:opam /src
              sudo apk add --no-cache musl-dev
              opam install . --deps-only
              opam exec -- dune build --profile static bin/wand.exe
              # A downloaded binary is read by nothing that wants symbols,
              # and stripping takes it from 7.3 MB to 3.0 MB.
              sudo strip _build/default/bin/wand.exe
              # Handing the tree back, so the steps after this one -- and the
              # checkout action cleaning up after itself -- still own it.
              sudo chown -R "$HOST_UID:$HOST_GID" /src
            '
          do
            if [ "$attempt" -ge 3 ]; then
              echo "the musl build failed $attempt times; that is not the flake" >&2
              exit 1
            fi
            echo "musl build failed (attempt $attempt), trying again" >&2
            attempt=$((attempt + 1))
          done

      - name: Set up OCaml (macOS)
        if: ${{ !matrix.static }}
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.x"

      - name: Build (macOS)
        if: ${{ !matrix.static }}
        run: |
          set -euo pipefail
          opam install . --deps-only
          opam exec -- dune build --profile release bin/wand.exe

      # What the release claims is that the binary runs where it is put. It
      # is checked here, from a directory with no wand tree above it, because
      # that is exactly what P4.1 fixed and exactly what a download does.
      - name: Check it runs where it is put
        run: |
          set -euo pipefail
          BIN="$PWD/_build/default/bin/wand.exe"
          file "$BIN"
          if [ "${{ matrix.static }}" = "true" ]; then
            # A dynamically linked binary would pass everything below on this
            # runner and fail on the user's machine. Read from `file` rather
            # than `ldd`, whose wording for a static binary differs between
            # the glibc host and the musl build. musl links these as PIE, so
            # `file` says "static-pie linked" -- still static, and still what
            # this is checking for.
            file "$BIN" | grep -qE "statically linked|static-pie linked" || {
              echo "expected a static binary" >&2
              exit 1
            }
          fi
          cd /tmp
          mkdir -p stdlib
          echo 'let length x = "hijacked"' > stdlib/List.wand
          # Each check reports what it got. A bare `test` that fails says
          # nothing, which costs a whole CI round trip to learn one string.
          check() {
            got=$("$BIN" -e "$1" 2>&1) && rc=0 || rc=$?
            if [ "$got" != "$2" ]; then
              echo "wand -e '$1'" >&2
              echo "  expected: $2" >&2
              echo "  got:      $got" >&2
              echo "  exit:     $rc" >&2
              exit 1
            fi
            echo "wand -e '$1' -> $got"
          }
          check '1 + 2' '3 : Int'
          check 'List.length [1,2]' '2 : Int'
          echo "runs from /tmp, ignores a decoy stdlib/"

      # Archives are a tag's business. A dispatch run builds and proves the
      # binary works, which is what it is for; naming an archive after a
      # branch only produces a `wand-main-...tar.gz` nobody should install.
      - name: Package
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          NAME="wand-${VERSION}-${{ matrix.target }}"
          mkdir -p "dist/$NAME"
          cp _build/default/bin/wand.exe "dist/$NAME/wand"
          chmod 755 "dist/$NAME/wand"
          cp LICENSE README.md "dist/$NAME/"
          tar -czf "dist/$NAME.tar.gz" -C dist "$NAME"
          # Recorded from inside dist/, so the file names the archive rather
          # than a path that only existed on the runner -- `shasum -c` is run
          # next to the download, not here.
          (cd dist && shasum -a 256 "$NAME.tar.gz" > "$NAME.tar.gz.sha256")
          ls -la dist

      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Downloads artifacts and attaches them; minutes of real work.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # `gh` is on the runner, so this needs no third-party action.
      #
      # Create if absent, then upload. The macOS x86_64 archive is built on a
      # developer's Intel Mac by `make release` and attaches to this same
      # release, and neither side knows which of them will arrive first --
      # so both create-or-attach rather than assuming.
      #
      # A draft, because a release becomes public the moment it exists: left
      # undrafted, there is a window where someone downloads a release that
      # is missing their architecture. `gh release edit <tag> --draft=false`
      # publishes it once every archive is attached.
      - name: Attach the artifacts built here
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -la dist
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" \
              --draft \
              --title "$GITHUB_REF_NAME" \
              --notes-file .github/release-notes.md
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber

  # The install script, against the release it is about to serve.
  #
  # install.sh proves the downloaded binary runs before it installs it, and
  # that check has to be spelled the way the new binary answers. 0.55.0
  # removed `wand e`, install.sh still asked for it, and every install of
  # 0.55.0 failed with "the downloaded binary did not run". Nothing caught
  # it: the script is not in the test suite, and a CI job on `main` can only
  # install a release that already exists, which was still the old one.
  #
  # This runs after the archives are attached and before anyone publishes,
  # so a broken installer stops a draft rather than reaching a user.
  installs:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      # The two the runners can reach. macOS x86_64 is built by hand,
      # because GitHub's Intel runner never leaves the queue, so no job here
      # can install it -- the Makefile's own checks cover that one.
      matrix:
        runs-on: [ubuntu-latest, macos-15]
    steps:
      - uses: actions/checkout@v4

      - name: Install the version just built, and run it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          dir="$RUNNER_TEMP/wand-install"
          WAND_VERSION="$VERSION" WAND_INSTALL_DIR="$dir" sh install.sh

          # The binary has to be the one that was asked for. An archive
          # built from the wrong tree passes every other check in this file.
          got=$("$dir/wand" version 2>/dev/null || "$dir/wand" V 2>/dev/null)
          test "$got" = "wand $VERSION" || {
            echo "::error::installed $got, asked for wand $VERSION" >&2
            exit 1
          }

          # And it has to run something, from a directory that is not a wand
          # tree, which is the whole claim the binary makes.
          # `wand -e` from 0.55.0, `wand e` before it. This workflow can be
          # re-run on an old tag, and an old spelling is not a failure.
          cd "$RUNNER_TEMP"
          out=$("$dir/wand" -e '1 + 1' 2>/dev/null || "$dir/wand" e '1 + 1')
          test "$out" = "2 : Int" || {
            echo "::error::wand -e '1 + 1' answered '$out'" >&2
            exit 1
          }
          echo "installed and ran wand $VERSION on ${{ matrix.runs-on }}"
