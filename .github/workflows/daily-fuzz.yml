# The fuzzer, given time. `dune test` runs the reproducers it has already
# filed; this is the half that looks for new ones, and it looks for as long
# as a daily job can afford.
#
# A scheduled workflow only ever runs from the default branch, and GitHub
# disables one after 60 days without a push -- so a quiet month turns this
# off silently. `workflow_dispatch` is here to run it by hand, with a seed,
# which is also how a red night is reproduced.

name: Daily Fuzz

on:
  schedule:
    # 07:37 UTC. Nothing depends on the exact time; it is early enough that a
    # finding is waiting rather than arriving mid-morning.
    #
    # This schedule does not currently fire, and the time of day is not why.
    # 07:00 was asked for first and produced no run. 07:37 produced no run.
    # A probe workflow at `*/10 * * * *` then produced no run in five slots,
    # while pushes to the same repository built normally. So the fault is in
    # `schedule` for this repository, not in the hour chosen. Nothing here
    # accounts for it: the repository is public, it is not a fork, Actions
    # is enabled, and this file is on the default branch. Only GitHub can
    # say more; ask their support.
    #
    # Until a run appears here on its own, treat the schedule as manual: use
    # `workflow_dispatch`, driven by a scheduler outside GitHub. Dispatch
    # works, so a finding is still one command away.
    - cron: "37 7 * * *"
  workflow_dispatch:
    inputs:
      seed:
        description: "Seed to start from (blank uses the run id)"
        required: false
        default: ""
      minutes:
        description: "Minutes per shard"
        required: false
        default: "45"

permissions:
  contents: read
  issues: write

concurrency:
  group: daily-fuzz
  cancel-in-progress: false

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      # Four seeds rather than one long run: the mutations are independent,
      # so four hours of wall clock in one hour is four times the inputs,
      # and a shard that finds something does not stop the others.
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.x"

      - name: Install dependencies
        run: opam install . --deps-only --with-test

      - name: Build
        run: opam exec -- dune build

      # The seed is the run id plus the shard, so it is different every
      # night, recorded in the run, and enough on its own to replay a
      # finding: `fuzz --seed S --only I`. A finding's notes carry both.
      - name: Fuzz
        id: fuzz
        run: |
          # No -e: a finding is a non-zero exit from the fuzzer, and this
          # step has to record it rather than die on it. The last step of
          # the job is what turns it into a red run.
          set +e
          set -uo pipefail
          BASE="${{ github.event.inputs.seed }}"
          if [ -z "$BASE" ]; then BASE="${{ github.run_id }}"; fi
          SEED=$(( BASE + ${{ matrix.shard }} ))
          MINUTES="${{ github.event.inputs.minutes }}"
          if [ -z "$MINUTES" ]; then MINUTES=45; fi
          echo "seed=$SEED" >> "$GITHUB_OUTPUT"
          _build/default/test/fuzz/fuzz.exe \
            --seed "$SEED" \
            --iterations 100000000 \
            --seconds $(( MINUTES * 60 )) \
            --timeout 20 \
            --shrink 2000 \
            | tee fuzz.log
          echo "status=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      # Uploaded whether or not anything was found: the log is the record of
      # how many inputs a night actually got through, which is the only way
      # to notice the fuzzer quietly slowing down or stopping early.
      - name: Keep the findings and the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-shard-${{ matrix.shard }}
          path: |
            _fuzz-findings/
            fuzz.log
          if-no-files-found: warn

      - name: Fail if the shard found something new
        if: steps.fuzz.outputs.status != '0'
        run: |
          echo "seed ${{ steps.fuzz.outputs.seed }} found something new" >&2
          exit 1

  # One job after all four, so a signature two shards hit becomes one issue
  # rather than two.
  report:
    needs: fuzz
    if: always() && needs.fuzz.result == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: findings

      # One issue per signature, and the title is the signature -- so the
      # second night a bug survives updates nothing and files nothing. The
      # body carries the replay line and the shrunk input, which is all
      # anyone needs to start.
      - name: File an issue for each new signature
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          # The label has to exist before an issue can carry it, and a
          # fresh clone of this repository has no reason to have it.
          gh label create fuzz --description "Found by the daily fuzzer" \
            --color FBCA04 2>/dev/null || true

          # Every title with an issue still open, read once, from the
          # issues endpoint.
          #
          # This used to ask the search endpoint per signature, and search is
          # indexed asynchronously: two shards hitting one signature four
          # seconds apart both found nothing and both filed, which is how
          # this repository got two issues with one title. Listing is
          # read-your-writes, and a title filed in this run is added below,
          # so the second shard sees the first shard's issue whatever the
          # index is doing.
          #
          # Open, not all. A closed issue says the bug is fixed, so the same
          # signature arriving again is a regression or a second bug wearing
          # the first one's name -- the two things most worth being told
          # about. Counting closed issues as filed hid four `format:unstable`
          # findings behind an issue closed hours earlier, and they surfaced
          # only because someone downloaded the artifacts. A bug that is
          # known and not being fixed belongs in test/fuzz/known.txt, which
          # keeps the run green without hiding anything.
          gh issue list --label fuzz --state open --limit 500 \
            --json title --jq '.[].title' > filed.txt

          filed=0
          for notes in findings/*/_fuzz-findings/*.json; do
            input="${notes%.json}.wand"
            sig=$(jq -r '.signature' "$notes")
            [ -n "$sig" ] && [ "$sig" != "null" ] || continue
            title="fuzz: $sig"
            if grep -Fxq "$title" filed.txt; then
              echo "already filed: $title"
              continue
            fi
            {
              echo "Found by the daily fuzzer (\`${{ github.workflow }}\`, run [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}))."
              echo
              echo '```json'
              cat "$notes"
              echo '```'
              echo
              echo "Input:"
              echo
              echo '```'
              cat "$input"
              echo '```'
              echo
              echo "If this is not going to be fixed now, put the signature in"
              echo "\`test/fuzz/known.txt\` so the next night is green. When it is fixed,"
              echo "put the input in \`test/fuzz/regressions/\`."
            } > body.md
            gh issue create --title "$title" --body-file body.md --label fuzz
            # Before the next shard's finding is considered, not after the
            # loop: the duplicate this guards against is inside one run.
            printf '%s\n' "$title" >> filed.txt
            filed=$((filed + 1))
          done
          echo "filed $filed issue(s)"
